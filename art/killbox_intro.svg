</g>
<g fill="#29434a" opacity=".55">
 <g transform="translate(140 300)"><rect x="0" y="0" width="8" height="12"/><rect x="22" y="0" width="8" height="12"/><rect x="44" y="0" width="8" height="12"/><rect x="0" y="25" width="8" height="12"/><rect x="44" y="25" width="8" height="12"/></g>
