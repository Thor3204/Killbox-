<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071017"/><stop offset=".62" stop-color="#17232a"/><stop offset="1" stop-color="#080c10"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#55e1c0" stop-opacity=".45"/><stop offset="1" stop-color="#55e1c0" stop-opacity="0"/></radialGradient>
 <linearGradient id="road" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10181d"/><stop offset=".5" stop-color="#263238"/><stop offset="1" stop-color="#0d1418"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#sky)"/>
<circle cx="1010" cy="190" r="250" fill="url(#glow)" filter="url(#blur)"/>
