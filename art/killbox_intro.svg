 <g transform="translate(670 260)"><rect x="0" y="0" width="10" height="15"/><rect x="30" y="0" width="10" height="15"/><rect x="60" y="0" width="10" height="15"/><rect x="90" y="0" width="10" height="15"/><rect x="30" y="32" width="10" height="15"/><rect x="90" y="32" width="10" height="15"/></g>
</g>
