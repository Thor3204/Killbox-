<g transform="translate(1010 555) scale(.8)" fill="#25343a"><path d="M0 45 L20 15 Q30 0 60 0 H125 Q150 0 164 20 L180 45 Z"/><rect y="45" width="180" height="32" rx="10"/><circle cx="38" cy="77" r="18" fill="#080c0f"/><circle cx="145" cy="77" r="18" fill="#080c0f"/></g>
